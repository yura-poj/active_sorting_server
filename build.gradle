plugins {
    id 'java'
    id 'application'
}

group = 'pozhidaev'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}

application {
    mainClass = "pozhidaev.Main"

}

tasks.named('run') {
    standardInput = System.in
}